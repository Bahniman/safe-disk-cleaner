name: Release

# On a v* tag: run the same build as build.yml, then attach SafeDiskCleaner-win-x64.zip to a
# GitHub Release. The release is created as a draft so nothing is visible to anyone until
# the owner reviews it and clicks Publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SafeDiskCleaner-win-x64

      - name: Checksum
        run: sha256sum SafeDiskCleaner-win-x64.zip | tee SafeDiskCleaner-win-x64.zip.sha256

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Safe Disk Cleaner ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            SafeDiskCleaner-win-x64.zip
            SafeDiskCleaner-win-x64.zip.sha256
          body: |
            Download `SafeDiskCleaner-win-x64.zip`, unzip it anywhere, and run `SafeDiskCleaner.exe`.
            Nothing to install. Windows may show a SmartScreen warning because the app is not
            code-signed: choose **More info**, then **Run anyway**. See the README for details.
